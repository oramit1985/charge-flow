services:
  localstack:
    image: localstack/localstack:3
    ports:
      - '4566:4566'
    environment:
      SERVICES: s3,sqs,dynamodb,events,ses
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    ports:
      - '3001:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      ORDER_EVENT_BUS_NAME: ecommerce-orders
      ORDERS_TABLE: orders
      SES_FROM_EMAIL: no-reply@ecommerce.example.com
      SQS_QUEUE_NAME: order-service-status-updates
    depends_on:
      localstack:
        condition: service_healthy

  invoice-service:
    build:
      context: .
      dockerfile: apps/invoice-service/Dockerfile
    ports:
      - '3002:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      ORDER_EVENT_BUS_NAME: ecommerce-orders
      S3_INVOICES_BUCKET: invoices
      SQS_QUEUE_NAME: invoice-service-order-created
    depends_on:
      localstack:
        condition: service_healthy

  billing-service:
    build:
      context: .
      dockerfile: apps/billing-service/Dockerfile
    ports:
      - '3003:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      ORDER_EVENT_BUS_NAME: ecommerce-orders
      STRIPE_SECRET_KEY: sk_test_placeholder
      SQS_QUEUE_NAME: billing-service-order-invoiced
    depends_on:
      localstack:
        condition: service_healthy

  shipping-service:
    build:
      context: .
      dockerfile: apps/shipping-service/Dockerfile
    ports:
      - '3004:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      ORDER_EVENT_BUS_NAME: ecommerce-orders
      SQS_QUEUE_NAME: shipping-service-order-paid
      # Points to the mock carrier running inside this same service container.
      # In production, replace with https://express.api.dhl.com/mydhlapi and real credentials.
      DHL_BASE_URL: http://shipping-service:3000/mock-carrier
      DHL_API_KEY: dev-placeholder
      DHL_API_SECRET: dev-placeholder
      DHL_ACCOUNT_NUMBER: dev-placeholder
      DHL_SHIPPER_NAME: Dev Shipper
      DHL_SHIPPER_EMAIL: dev@example.com
      DHL_SHIPPER_PHONE: '+10000000000'
      DHL_SHIPPER_ADDRESS_LINE1: 1 Dev Street
      DHL_SHIPPER_CITY: Dev City
      DHL_SHIPPER_POSTAL_CODE: '00000'
      DHL_SHIPPER_COUNTRY_CODE: US
      DHL_DEFAULT_WEIGHT_KG: '1'
    depends_on:
      localstack:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    ports:
      - '3005:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      ORDER_EVENT_BUS_NAME: ecommerce-orders
      SES_FROM_EMAIL: no-reply@ecommerce.example.com
      SQS_QUEUE_NAME: notification-service-all-events
    depends_on:
      localstack:
        condition: service_healthy

volumes:
  localstack_data:
